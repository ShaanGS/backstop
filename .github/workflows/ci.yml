name: reliability

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: types + reliability suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No version pinned here on purpose: package.json's packageManager field
      # is the single source of truth, and specifying both makes the action fail.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # The suite runs in fixture mode: the third-party network boundary is
      # stubbed, so no API keys are needed, but every Keel gate — policy,
      # idempotency, retry, read-back verification, ledger — executes for real.
      # All 14 cases must pass, including the 5 that assert Keel does nothing.
      - name: Reliability suite
        run: pnpm eval

      - name: Upload scorecard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reliability-report
          path: evals/REPORT.md
