<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 452" width="880" height="452" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, sans-serif">
  <style>
    .t   { fill: #8b8f98; font-size: 11px; }
    .lbl { fill: #16171a; font-size: 12.5px; font-weight: 600; }
    .mono{ fill: #6f737b; font-size: 10.5px; font-family: ui-monospace, 'SF Mono', Menlo, monospace; }
    .hd  { fill: #16171a; font-size: 11px; font-weight: 700; letter-spacing: .07em; }
    .box { fill: #ffffff; stroke: #e3e1dd; }
    .pane{ fill: #f7f7f5; stroke: #e3e1dd; }
    .arw { stroke: #b9bcc2; stroke-width: 1.3; fill: none; }
    @media (prefers-color-scheme: dark) {
      .t{fill:#8d9098}.lbl{fill:#f2f2f3}.mono{fill:#868a92}.hd{fill:#f2f2f3}
      .box{fill:#151517;stroke:#2b2b2f}.pane{fill:#101012;stroke:#26262a}.arw{stroke:#3e3e45}
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#b9bcc2" />
    </marker>
  </defs>

  <!-- PHASE 1 -->
  <rect class="pane" x="14" y="14" width="852" height="150" rx="12" />
  <text class="hd" x="34" y="40">PHASE 1 — INVESTIGATION</text>
  <text class="t"  x="215" y="40">model-driven · read-only · the agent chooses its own path</text>

  <rect class="box" x="34" y="56" width="150" height="44" rx="9" />
  <text class="lbl" x="48" y="74">claude-opus-5</text>
  <text class="mono" x="48" y="90">streamText tool loop</text>

  <path class="arw" marker-end="url(#a)" d="M184 78 H228" />

  <rect class="box" x="232" y="56" width="146" height="44" rx="9" />
  <text class="mono" x="246" y="76">list_accounts</text>
  <text class="mono" x="246" y="91">get_account_snapshot</text>

  <path class="arw" marker-end="url(#a)" d="M378 78 H422" />

  <rect class="box" x="426" y="56" width="118" height="44" rx="9" />
  <text class="lbl" x="440" y="74">Stripe</text>
  <text class="mono" x="440" y="90">billing · renewal</text>

  <rect class="box" x="556" y="56" width="118" height="44" rx="9" />
  <text class="lbl" x="570" y="74">Linear</text>
  <text class="mono" x="570" y="90">tickets · escalations</text>

  <rect class="box" x="686" y="56" width="150" height="44" rx="9" />
  <text class="lbl" x="700" y="74">Usage telemetry</text>
  <text class="mono" x="700" y="90">first-party</text>

  <rect class="box" x="34" y="112" width="344" height="34" rx="9" />
  <text class="mono" x="48" y="133">propose_save_play  ← the only terminal tool</text>
  <text class="t" x="396" y="133">proposes a plan. performs nothing.</text>

  <!-- seam -->
  <path class="arw" marker-end="url(#a)" d="M206 164 V196" />
  <text class="t" x="218" y="186">a Plan, not an action</text>

  <!-- PHASE 2 -->
  <rect class="pane" x="14" y="200" width="852" height="236" rx="12" />
  <text class="hd" x="34" y="226">PHASE 2 — EXECUTION</text>
  <text class="t"  x="196" y="226">fully deterministic · the model is never consulted again</text>

  <g>
    <rect class="box" x="34" y="244" width="126" height="52" rx="9" />
    <text class="lbl" x="48" y="266">Policy</text>
    <text class="mono" x="48" y="282">5 rules</text>

    <path class="arw" marker-end="url(#a)" d="M160 270 H196" />
    <rect class="box" x="200" y="244" width="126" height="52" rx="9" />
    <text class="lbl" x="214" y="266">Approval gate</text>
    <text class="mono" x="214" y="282">plan-level</text>

    <path class="arw" marker-end="url(#a)" d="M326 270 H362" />
    <rect class="box" x="366" y="244" width="126" height="52" rx="9" />
    <text class="lbl" x="380" y="266">Idempotency</text>
    <text class="mono" x="380" y="282">sha256 ledger</text>

    <path class="arw" marker-end="url(#a)" d="M492 270 H528" />
    <rect class="box" x="532" y="244" width="126" height="52" rx="9" />
    <text class="lbl" x="546" y="266">Execute</text>
    <text class="mono" x="546" y="282">1 retry</text>

    <path class="arw" marker-end="url(#a)" d="M658 270 H694" />
    <rect class="box" x="698" y="244" width="138" height="52" rx="9" />
    <text class="lbl" x="712" y="266">Verify</text>
    <text class="mono" x="712" y="282">read back by id</text>
  </g>

  <!-- writes -->
  <path class="arw" marker-end="url(#a)" d="M595 296 V326" />
  <rect class="box" x="366" y="330" width="132" height="44" rx="9" />
  <text class="lbl" x="380" y="348">Linear</text>
  <text class="mono" x="380" y="364">recovery task</text>

  <rect class="box" x="512" y="330" width="132" height="44" rx="9" />
  <text class="lbl" x="526" y="348">Notion</text>
  <text class="mono" x="526" y="364">save plan</text>

  <rect class="box" x="658" y="330" width="132" height="44" rx="9" />
  <text class="lbl" x="672" y="348">Resend · Slack</text>
  <text class="mono" x="672" y="364">email · alert</text>

  <!-- verification loop back -->
  <path class="arw" d="M790 352 H822 V270 H836" stroke-dasharray="3 3" />
  <text class="t" x="700" y="392">every write is re-read from the app that received it</text>

  <!-- audit -->
  <rect class="box" x="34" y="330" width="300" height="44" rx="9" />
  <text class="lbl" x="48" y="348">Append-only audit log</text>
  <text class="mono" x="48" y="364">every read · decision · action · verification</text>

  <text class="t" x="34" y="416">An LLM can be wrong about judgment. It can never talk its way past a rule, duplicate an email,</text>
  <text class="t" x="34" y="430">or report an action as done that did not land in the external app.</text>
</svg>
